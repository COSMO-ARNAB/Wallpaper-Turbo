name: Compile & Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: |
        dotnet restore src/WallpaperTurbo.UI/WallpaperTurbo.UI.csproj -p:Platform=x64
        dotnet restore src/WallpaperTurbo.AppRunner/WallpaperTurbo.AppRunner.csproj -p:Platform=x64

    - name: Compile and Publish WPF App
      run: |
        dotnet publish src/WallpaperTurbo.UI/WallpaperTurbo.UI.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ${{ github.workspace }}/publish/

    - name: Install Inno Setup
      run: choco install innosetup

    - name: Build Installer (Inno Setup)
      shell: cmd
      run: '"C:\Program Files (x86)\Inno Setup 6\iscc.exe" src/WallpaperTurbo.Installer/installer.iss'

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: setup/Wallpaper_Turbo_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
